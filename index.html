<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale/user-scalable=no: a pinch or double-tap during a flick must not zoom
       the page instead of aiming. viewport-fit=cover lets the board reach behind notches
       on full-screen mobile displays. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TAW" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>TAW</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="board3d"></canvas>
  <canvas id="board2d"></canvas>
  <div id="hud"></div>
  <div id="menu" class="overlay"></div>
  <div id="end-overlay" class="overlay" style="display:none;"></div>
  <div id="rotate-overlay" class="overlay" style="display:none;">
    <p class="rotate-icon">&#8635;</p>
    <p>Rotate your device to landscape to play.</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
