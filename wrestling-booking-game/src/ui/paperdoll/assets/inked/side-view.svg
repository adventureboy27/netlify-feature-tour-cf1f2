<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360">
  <!-- Hand-inked side view, facing right: head, torso, far and near arms, trunks, legs, boots. -->
  <g stroke="#0b0b0d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- far arm (behind the body) -->
    <path d="M122 96 Q150 118 152 162 Q148 170 140 166 Q136 130 118 110 Z" fill="#9a6a45"/>
    <!-- head, in profile -->
    <path d="M104 22 Q126 6 146 24 Q156 44 150 66 Q146 80 132 84 Q118 86 110 80 Q102 70 102 52 Q100 34 104 22 Z" fill="#b5804f"/>
    <!-- mask-free hair line -->
    <path d="M106 30 Q124 16 144 30" fill="none" stroke="#17181c" stroke-width="5"/>
    <!-- ear and jaw -->
    <path d="M120 58 Q126 62 126 70" fill="none" stroke-width="2"/>
    <!-- neck and chest, profile -->
    <path d="M112 82 Q108 100 112 120 Q124 132 148 128 Q164 116 158 96 Q148 86 132 84 Z" fill="#b5804f"/>
    <!-- torso and back -->
    <path d="M110 120 Q104 150 110 176 L152 180 Q160 160 150 128 Q132 136 110 120 Z" fill="#b5804f"/>
    <!-- trunks, seen from the side -->
    <path d="M106 176 L156 180 L160 214 L104 214 Z" fill="#17181c"/>
    <path d="M124 178 L126 212" stroke="#f2f2ee" stroke-width="3" fill="none"/>
    <!-- near leg, forward -->
    <path d="M110 212 Q112 250 114 286 L140 286 Q140 250 146 214 Z" fill="#b5804f"/>
    <!-- far leg, back -->
    <path d="M140 212 Q142 250 150 280 L168 276 Q158 246 158 214 Z" fill="#9a6a45"/>
    <!-- trunk leg-stripe on the near leg -->
    <path d="M118 220 Q120 252 122 282" stroke="#17181c" stroke-width="2" fill="none" opacity=".5"/>
    <!-- boots -->
    <path d="M110 284 L142 284 Q150 296 146 304 L108 304 Q104 292 110 284 Z" fill="#101114"/>
    <path d="M150 276 L170 274 Q176 292 170 300 L152 302 Q148 290 150 276 Z" fill="#17181c"/>
    <!-- white soles -->
    <path d="M106 302 L148 302 Q150 308 146 310 L104 310 Z" fill="#e9e9e4"/>
    <path d="M152 300 L170 298 Q172 304 168 306 L150 306 Z" fill="#e9e9e4"/>
  </g>
  <!-- hatching: the shadow side of the torso and the far leg -->
  <g stroke="#000" stroke-width="1" opacity=".4">
    <path d="M140 136 L146 146 M136 150 L142 160 M132 164 L138 174"/>
    <path d="M152 240 L156 248 M154 256 L158 264"/>
  </g>
  <!-- eye and mouth, inked -->
  <path d="M136 42 Q140 40 144 42" fill="none" stroke="#0b0b0d" stroke-width="2"/>
  <path d="M138 66 Q142 70 146 66" fill="none" stroke="#0b0b0d" stroke-width="2"/>
</svg>
